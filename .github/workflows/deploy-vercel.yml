name: Vercel Deploy

# Trigger on main branch (prod) and all other branches (preview)
on:
  push:
    branches:
      - main
      - '**'        # all other branches
  pull_request:
    branches:
      - '**'        # all PRs

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "Deploying branch ${GITHUB_REF##*/}"
          if [ "${GITHUB_REF##*/}" = "main" ]; then
            # Production deploy
            npx vercel deploy --prod --confirm --token $VERCEL_TOKEN
          else
            # Branch/PR preview deploy
            npx vercel deploy --confirm --prebuilt --token $VERCEL_TOKEN
