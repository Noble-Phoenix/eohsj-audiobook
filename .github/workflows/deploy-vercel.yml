name: Vercel Deploy

# Trigger on pushes to main (prod) and any branch (preview)
on:
  push:
    branches:
      - main
      - '**'        # all branches for preview
  pull_request:
    branches:
      - '**'        # all PRs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${GITHUB_REF##*/}" = "main" ]; then
            # Production deploy
            npx vercel deploy \
              --prod \
              --confirm \
              --token $VERCEL_TOKEN \
              --org ${{ secrets.VERCEL_ORG_ID }} \
              --project ${{ secrets.VERCEL_PROJECT_ID }}
          else
            # Preview deploy for branch or PR
            npx vercel deploy \
              --confirm \
              --token $VERCEL_TOKEN \
              --org ${{ secrets.VERCEL_ORG_ID }} \
              --project ${{ secrets.VERCEL_PROJECT_ID }} \
              --prebuilt \
              --env NEXT_PUBLIC_SITE_URL="https://your-preview-domain.vercel.app" \
              --meta github-ref="${GITHUB_REF##*/}"
          fi
